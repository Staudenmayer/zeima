[package]
name = "host-test"
description = "Zeima addon test fixture: secrets, OAuth tokens and timeline items"
version = "1.0.0"
edition = "2021"
publish = false

# Built on its own for wasm32-unknown-unknown (see ../build.sh).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zeima-addon-sdk = { path = "../../crates/zeima-addon-sdk" }
extism-pdk = "1.4"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
