[package]
name = "time-app"
description = "Time: local-first time tracking"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "time_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
time-core = { workspace = true, features = ["db", "specta"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
iana-time-zone = "0.1"
chrono.workspace = true
chrono-tz.workspace = true
sys-locale = "0.3"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rust_xlsxwriter = "0.99.1"
time-addon-sdk.workspace = true
toml.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
extism = "1.41"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
user-idle = { version = "0.6", default-features = false }
