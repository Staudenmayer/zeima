# Flatpak manifest for Zeima. It repackages the .deb that `tauri build`
# produced (zeima.deb next to this file, copied there by the release
# workflow), plus the tray-icon libraries the GNOME runtime lacks.
#
#   cp target/release/bundle/deb/*.deb packaging/flatpak/zeima.deb
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     --repo=repo build packaging/flatpak/com.zeima.zeima.yml
app-id: com.zeima.zeima
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: zeima

finish-args:
  - --share=ipc
  - --share=network # sync and OAuth sign-in
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Tray icon and notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Keychain for addon secrets and OAuth tokens
  - --talk-name=org.freedesktop.secrets
  # Idle detection
  - --talk-name=org.gnome.Mutter.IdleMonitor
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.login1

modules:
  # Tray icon support (libappindicator is loaded at runtime by the app).
  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      cflags: -Wno-error
    config-opts:
      - --with-gtk=3
      - --disable-gtk-doc
      - --disable-dumper
      - --disable-tests
      - --disable-vala
      - --enable-introspection=no
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
    cleanup: [/include, /lib/pkgconfig, '*.la']

  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_TESTS=OFF
      - -DENABLE_INTROSPECTION=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.10.4.tar.gz
        sha256: bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38
    cleanup: [/include, /lib/pkgconfig]

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.4.tar.gz
        sha256: a18d3c682e29afd77db24366f8475b26bda22b0e16ff569a2ec71cd6eb4eac95
    cleanup: [/include, /lib/pkgconfig]

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_TESTS=OFF
      - -DENABLE_BINDINGS_MONO=OFF
      - -DENABLE_BINDINGS_VALA=OFF
      - -DENABLE_GTKDOC=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-appindicator/archive/refs/tags/0.5.94.tar.gz
        sha256: 884a6bc77994c0b58c961613ca4c4b974dc91aa0f804e70e92f38a542d0d0f90
    cleanup: [/include, /lib/pkgconfig]

  - name: zeima
    buildsystem: simple
    sources:
      - type: file
        path: zeima.deb
        dest-filename: zeima.deb
    build-commands:
      - ar -x zeima.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/zeima /app/bin/zeima
      # Flatpak wants the desktop file and icons named after the app id.
      - |
        install -Dm644 usr/share/applications/*.desktop /app/share/applications/com.zeima.zeima.desktop
        sed -i 's/^Icon=.*/Icon=com.zeima.zeima/' /app/share/applications/com.zeima.zeima.desktop
      - |
        for icon in $(find usr/share/icons -name 'zeima.png'); do
          dest=/app/${icon#usr/}
          install -Dm644 "$icon" "$(dirname "$dest")/com.zeima.zeima.png"
        done
