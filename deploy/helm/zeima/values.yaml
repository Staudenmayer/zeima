# Zeima for Kubernetes (docs/helm.md). The two addresses are required; everything else has a default
# that works for a trial. The images are built from this repository (docs/helm.md, "Images").

# Where the apps reach the API, and the sign-in service. Two host names that point at the ingress.
publicUrl: ""    # https://zeima.example.com
idUrl: ""        # https://id.zeima.example.com

api:
  image:
    repository: zeima-api
    tag: ""            # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  # Presence and the replica bus are shared through PostgreSQL (M0-M2), but the chart still runs one copy until M5 (reconcile leader, shared quotas, rollout): do not raise this yet.
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  docsEnabled: false
  # How many proxies are in front of the API (the ingress controller: 1). A number, or a list of proxy
  # addresses/CIDRs. Not `true`: that believes any X-Forwarded-For, so a caller could pick their own address.
  trustProxy: "1"
  # Prometheus metrics at /metrics. The ingress routes everything to the API, so leave this off unless
  # your ingress blocks /metrics or you scrape from inside the cluster only.
  metricsEnabled: false
  # Hours between the checks of the member copy against Keycloak (0 = off).
  reconcileIntervalHours: 24
  # Vendor keys whose license tokens are accepted (server/README.md).
  entitlementPublicKeys: ""
  # Extra environment variables, as a map.
  extraEnv: {}

keycloak:
  image:
    repository: zeima-keycloak
    tag: "26.8.1"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
  # People must confirm their email address before they can sign in. Keep it on: without it anyone can register any
  # address (a colleague's, before the colleague does). It needs working mail: set smtp.host. To run without mail,
  # switch it off knowingly.
  verifyEmail: true
  # New accounts must set up an authenticator app (TOTP) at their first sign-in. Existing accounts: docs/admin-guide.md.
  requireMfa: false
  # REQUIRED: set it to true or false. May people create their own accounts on the sign-in page? `true` for a service open
  # to the public; `false` for a private installation whose people come in through single sign-on, a directory, SCIM or an
  # administrator. The chart does not install until you decide.
  registrationAllowed: null

smtp:
  host: ""
  port: 25
  from: no-reply@zeima.local
  starttls: false
  auth: false
  user: ""
  password: ""

# The database. The chart can run a single PostgreSQL itself (fine for a trial and small installs;
# back it up) or use yours: create two databases and users, one for the API and one for Keycloak.
postgres:
  enabled: true
  image: { repository: docker.io/library/postgres, tag: "17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac" }
  persistence:
    size: 10Gi
    storageClassName: ""
    existingClaim: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
externalDatabase:
  host: ""
  port: 5432
  api: { database: zeima, user: zeima }
  keycloak: { database: keycloak, user: keycloak }

# Passwords and secrets. Leave a value empty to have the chart make one (kept when you upgrade).
# Or point `existingSecret` at a Secret that has the keys listed in docs/helm.md.
secrets:
  existingSecret: ""
  postgresPassword: ""        # the API's database user (and the bundled PostgreSQL's)
  keycloakDbPassword: ""
  appDbPassword: ""          # the restricted database login requests are served through (letters, digits, _ . ~ -)
  keycloakAdminPassword: ""   # Keycloak's `admin` user
  apiAdminSecret: ""          # the API's service account in Keycloak
  webhookSecret: ""           # signs Keycloak's calls to the API

ingress:
  enabled: true
  className: ""
  annotations: {}
  # TLS: name of a Secret with the certificate for both host names, or leave empty for no TLS block
  # (cert-manager and the like add it through annotations).
  tlsSecretName: ""

# The addons this installation offers (signed packages and index.json, made by
# `node scripts/addons.mjs publish`). Copy the folder into the volume: docs/helm.md.
addonRegistry:
  enabled: false
  persistence:
    size: 1Gi
    storageClassName: ""
    existingClaim: ""

# Extra country profiles the apps download (docs/country-profiles.md): file name to content, or an
# existing ConfigMap whose keys are the files.
jurisdictions:
  existingConfigMap: ""
  files: {}

# Which pods may talk to which (needs a network plugin that enforces NetworkPolicy). Default: only the ingress
# controller reaches the API and Keycloak, the database only the API and Keycloak, and Keycloak's events port only
# Keycloak. `ingressFrom` says where the ingress controller runs: any namespace by default; narrow it to its own.
networkPolicy:
  enabled: true
  # Outgoing traffic of the API and Keycloak: only DNS, each other, the database, and PUBLIC addresses (identity providers, mail).
  # Private ranges, the link-local range and the cloud metadata address are blocked, so a provider address (or a name that
  # changes its DNS answer) cannot be used to reach your internal services. Anything inside your network that they must reach
  # (a mail relay, a directory server, an external database, a provider on a private network) goes in `egressAllowCidrs`.
  restrictEgress: true
  egressAllowCidrs: []   # e.g. ["10.20.30.0/24"]
  ingressFrom:
    - namespaceSelector: {}

# Show Keycloak's administration console and the master realm on the public sign-in host. Off: the ingress passes only
# what browsers and apps need (/realms/zeima, /resources). Leave it off and reach the console with `kubectl port-forward`.
exposeKeycloakAdmin: false

nodeSelector: {}
tolerations: []
imagePullSecrets: []
