{{- if .Values.ingress.enabled }}
{{- $api := include "zeima.url.host" (required "publicUrl is required" .Values.publicUrl) }}
{{- $id := include "zeima.url.host" (required "idUrl is required" .Values.idUrl) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "zeima.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $api | quote }}, {{ $id | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ $api | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } }
    - host: {{ $id | quote }}
      http:
        paths:
          {{- if .Values.exposeKeycloakAdmin }}
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-keycloak, port: { name: http } } }
          {{- else }}
          # Only what browsers and apps need of the sign-in service. Keycloak's administration console and the master
          # realm are not published (exposeKeycloakAdmin).
          {{- range $path := list "/realms/zeima" "/resources" }}
          - path: {{ $path }}
            pathType: Prefix
            backend: { service: { name: {{ $.Release.Name }}-keycloak, port: { name: http } } }
          {{- end }}
          - path: /robots.txt
            pathType: Exact
            backend: { service: { name: {{ .Release.Name }}-keycloak, port: { name: http } } }
          {{- end }}
{{- end }}
