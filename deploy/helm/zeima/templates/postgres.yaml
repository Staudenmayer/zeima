{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels: {{- include "zeima.labels" . | nindent 4 }}
data:
  10-keycloak.sh: |
    #!/bin/sh
    # Second database for Keycloak next to the API's. Runs once, when the data directory is created.
    set -e
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres <<SQL
    CREATE USER {{ .Values.externalDatabase.keycloak.user }} WITH PASSWORD '$KEYCLOAK_DB_PASSWORD';
    CREATE DATABASE {{ .Values.externalDatabase.keycloak.database }} OWNER {{ .Values.externalDatabase.keycloak.user }};
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "zeima.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "zeima.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-postgres
        {{- include "zeima.labels" . | nindent 8 }}
    spec:
      # Nothing in the pod talks to the Kubernetes API.
      automountServiceAccountToken: false
      # The image's postgres user is 999; the volume is made writable for that group.
      securityContext:
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.externalDatabase.api.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.externalDatabase.api.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "zeima.secretName" . }}, key: postgres-password } }
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "zeima.secretName" . }}, key: keycloak-db-password } }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.externalDatabase.api.user | quote }}, "-d", {{ .Values.externalDatabase.api.database | quote }}] }
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: {{ .Release.Name }}-postgres-init, defaultMode: 0555 }
        {{- if .Values.postgres.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim: { claimName: {{ .Values.postgres.persistence.existingClaim }} }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if not .Values.postgres.persistence.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
{{- end }}
