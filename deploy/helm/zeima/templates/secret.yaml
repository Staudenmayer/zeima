{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "zeima.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ include "zeima.secretValue" (list . "postgres-password" .Values.secrets.postgresPassword) | quote }}
  keycloak-db-password: {{ include "zeima.secretValue" (list . "keycloak-db-password" .Values.secrets.keycloakDbPassword) | quote }}
  keycloak-admin-password: {{ include "zeima.secretValue" (list . "keycloak-admin-password" .Values.secrets.keycloakAdminPassword) | quote }}
  api-admin-secret: {{ include "zeima.secretValue" (list . "api-admin-secret" .Values.secrets.apiAdminSecret) | quote }}
  webhook-secret: {{ include "zeima.secretValue" (list . "webhook-secret" .Values.secrets.webhookSecret) | quote }}
  smtp-password: {{ .Values.smtp.password | quote }}
{{- end }}
