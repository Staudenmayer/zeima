# Self-hosted Zeima: the API, Keycloak (sign-in), PostgreSQL and Caddy
# (HTTPS). SPEC §7.1.
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# The API is served at PUBLIC_URL and sign-in at ID_URL (two host names that
# point at this machine). Caddy gets certificates for DOMAIN and id.DOMAIN
# from Let's Encrypt automatically; ports 80 and 443 must reach it. For a
# trial on one machine use DOMAIN=localhost (Caddy's own local CA; browsers
# and the app will not trust it until you install that CA).
#
# The desktop app finds everything from PUBLIC_URL (Settings → Account →
# Server). Syncing needs a license: until an entitlement is added for your
# users or organization the server runs everything else but offers the Free
# plan (see server/README.md).

name: zeima

services:
  postgres:
    # Only the API and Keycloak can reach it, on a network that has no way out to the internet.
    networks: [db]
    image: docker.io/library/postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # what the image's start-up needs to prepare its data folder
    mem_limit: 1g
    environment:
      POSTGRES_USER: zeima
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: zeima
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeima -d zeima"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    networks: [default, db]
    # Keycloak plus the event listener that tells the API about changes (keycloak/listener).
    build:
      context: ./keycloak
    image: zeima-keycloak:26.8.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1536m
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in deploy/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${ID_URL:?set ID_URL in deploy/.env}
      # TLS ends at Caddy.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Placeholders in realm-zeima.json
      ZEIMA_API_ADMIN_SECRET: ${API_ADMIN_SECRET:?set API_ADMIN_SECRET in deploy/.env}
      ZEIMA_API_URL: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
      ZEIMA_WEB_URL: ${PUBLIC_URL}
      ZEIMA_SWAGGER_ENABLED: "false"
      ZEIMA_SMTP_HOST: ${SMTP_HOST:-localhost}
      ZEIMA_SMTP_PORT: ${SMTP_PORT:-25}
      ZEIMA_SMTP_FROM: ${SMTP_FROM:-no-reply@zeima.local}
      ZEIMA_SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      ZEIMA_SMTP_AUTH: ${SMTP_AUTH:-false}
      ZEIMA_SMTP_USER: ${SMTP_USER:-}
      ZEIMA_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # On by default: without it anyone can register any address (also a colleague's before the colleague does).
      ZEIMA_VERIFY_EMAIL: ${VERIFY_EMAIL:-true}
      # A decision, not a default: may people create their own accounts on the sign-in page? (docs/admin-guide.md)
      ZEIMA_REGISTRATION_ALLOWED: ${REGISTRATION_ALLOWED:?decide whether people may register themselves: set REGISTRATION_ALLOWED=true or false in deploy/.env}
      # The event listener calls the API when KEYCLOAK_WEBHOOK_SECRET is set (the API's side of it);
      # without a secret it does nothing and the API's nightly check keeps its copy right.
      ZEIMA_WEBHOOK_URL: ${KEYCLOAK_WEBHOOK_SECRET:+http://api:3001/v1/internal/keycloak-events}
      ZEIMA_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:-}
    volumes:
      - ./keycloak/realm-zeima.json:/opt/keycloak/data/import/realm-zeima.json:ro,z
      - ./keycloak/themes/zeima:/opt/keycloak/themes/zeima:ro,z
    depends_on:
      postgres:
        condition: service_healthy

  api:
    networks: [default, db]
    build:
      context: ..
      dockerfile: server/Dockerfile
    # The name the air-gapped bundle loads the image under (docs/airgap.md).
    image: zeima-api:${ZEIMA_VERSION:-latest}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: self_hosted
      # One proxy (Caddy) is in front: believe only the address it saw. "true" would trust any X-Forwarded-For.
      TRUST_PROXY: "1"
      # Keycloak's events and the metrics are served on this port only (not through Caddy).
      INTERNAL_PORT: "3001"
      PUBLIC_URL: ${PUBLIC_URL}
      DATABASE_URL: postgres://zeima:${POSTGRES_PASSWORD}@postgres:5432/zeima
      # Requests run through a restricted login (`zeima_app`: no superuser, row-level security applies and cannot be
      # stepped out of); the API sets the login up with this password. Letters, digits and _ . ~ - only.
      APP_DATABASE_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env (16+ letters and digits)}
      KEYCLOAK_URL: ${ID_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      # Lets the API manage users and organizations in Keycloak.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${API_ADMIN_SECRET}
      # Keycloak's event listener calls the API with this secret; leave empty to rely on the nightly check.
      KEYCLOAK_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:-}
      RECONCILE_INTERVAL_HOURS: ${RECONCILE_INTERVAL_HOURS:-24}
      # Vendor keys whose license tokens are accepted (see server/README.md).
      ENTITLEMENT_PUBLIC_KEYS: ${ENTITLEMENT_PUBLIC_KEYS:-}
      # Addons this installation offers, and extra country profiles (the folders next to this file;
      # empty or missing folders offer nothing).
      ADDON_REGISTRY_DIR: /data/addon-registry
      JURISDICTIONS_DIR: /data/jurisdictions
    volumes:
      - ./addon-registry:/data/addon-registry:ro,z
      - ./jurisdictions:/data/jurisdictions:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  caddy:
    image: docker.io/library/caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
    depends_on:
      - api
      - keycloak

networks:
  db:
    internal: true

volumes:
  postgres:
  caddy-data:
