# Self-hosted Zeima: the API, Keycloak (sign-in), PostgreSQL and Caddy
# (HTTPS). SPEC §7.1.
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# The API is served at PUBLIC_URL and sign-in at ID_URL (two host names that
# point at this machine). Caddy gets certificates for DOMAIN and id.DOMAIN
# from Let's Encrypt automatically; ports 80 and 443 must reach it. For a
# trial on one machine use DOMAIN=localhost (Caddy's own local CA; browsers
# and the app will not trust it until you install that CA).
#
# The desktop app finds everything from PUBLIC_URL (Settings → Account →
# Server). Syncing needs a license: until an entitlement is added for your
# users or organization the server runs everything else but offers the Free
# plan (see server/README.md).

name: zeima

services:
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeima
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: zeima
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeima -d zeima"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in deploy/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${ID_URL:?set ID_URL in deploy/.env}
      # TLS ends at Caddy.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Placeholders in realm-zeima.json
      ZEIMA_API_ADMIN_SECRET: ${API_ADMIN_SECRET:?set API_ADMIN_SECRET in deploy/.env}
      ZEIMA_API_URL: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
      ZEIMA_WEB_URL: ${PUBLIC_URL}
      ZEIMA_SWAGGER_ENABLED: "false"
      ZEIMA_SMTP_HOST: ${SMTP_HOST:-localhost}
      ZEIMA_SMTP_PORT: ${SMTP_PORT:-25}
      ZEIMA_SMTP_FROM: ${SMTP_FROM:-no-reply@zeima.local}
      ZEIMA_SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      ZEIMA_SMTP_AUTH: ${SMTP_AUTH:-false}
      ZEIMA_SMTP_USER: ${SMTP_USER:-}
      ZEIMA_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ZEIMA_VERIFY_EMAIL: ${VERIFY_EMAIL:-false}
    volumes:
      - ./keycloak/realm-zeima.json:/opt/keycloak/data/import/realm-zeima.json:ro,z
      - ./keycloak/themes/zeima:/opt/keycloak/themes/zeima:ro,z
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: self_hosted
      TRUST_PROXY: "true"
      PUBLIC_URL: ${PUBLIC_URL}
      DATABASE_URL: postgres://zeima:${POSTGRES_PASSWORD}@postgres:5432/zeima
      KEYCLOAK_URL: ${ID_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      # Lets the API manage users and organizations in Keycloak.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${API_ADMIN_SECRET}
      # Vendor keys whose license tokens are accepted (see server/README.md).
      ENTITLEMENT_PUBLIC_KEYS: ${ENTITLEMENT_PUBLIC_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
    depends_on:
      - api
      - keycloak

volumes:
  postgres:
  caddy-data:
