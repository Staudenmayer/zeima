# Zeima sign-in pages: Keycloak's standard theme with the Zeima logo, colors
# and a few clearer texts. Mounted into Keycloak as themes/zeima; the realm
# selects it with "loginTheme" (deploy/keycloak/realm-zeima.json).
parent=keycloak.v2
import=common/keycloak
# Keep the parent's stylesheet and add ours.
styles=css/styles.css css/zeima.css
