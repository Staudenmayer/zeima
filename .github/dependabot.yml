# Keeps dependencies, base images and CI actions current; security updates come as their own pull requests.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/server, /deploy/keycloak]
    schedule: { interval: weekly }
  - package-ecosystem: maven
    directory: /deploy/keycloak/listener
    schedule: { interval: weekly }
