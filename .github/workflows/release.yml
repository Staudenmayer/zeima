name: Release

# Push a semver tag (v1.2.3, v1.2.3-rc.1) to build installers for every
# platform and attach them to a GitHub release. Bump the version first:
#   node scripts/version.mjs set 1.2.3 && git commit -am "chore: release 1.2.3"
#   git tag v1.2.3 && git push --follow-tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Read-only by default; only the jobs that publish get write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Without the vendor's addon publisher key compiled in, every signed addon is at best "server trusted" (docs/addons.md).
      # A final release must have it; a pre-release only warns.
      - name: The vendor's addon publisher key is set
        env:
          VENDOR_KEYS: ${{ vars.ZEIMA_ADDON_VENDOR_KEYS }}
          ALLOW_MISSING: ${{ vars.ZEIMA_ALLOW_RELEASE_WITHOUT_ADDON_KEY }}
        run: |
          if [ -z "$VENDOR_KEYS" ]; then
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              echo "::warning::ZEIMA_ADDON_VENDOR_KEYS is not set: signed addons will only ever show as 'server trusted' in this build."
            elif [ "$ALLOW_MISSING" = "true" ]; then
              echo "::warning::Releasing without ZEIMA_ADDON_VENDOR_KEYS because ZEIMA_ALLOW_RELEASE_WITHOUT_ADDON_KEY is true."
            else
              echo "::error::ZEIMA_ADDON_VENDOR_KEYS (repository variable) is empty. Set it (docs/releasing.md, 'Addon publisher keys'), or set ZEIMA_ALLOW_RELEASE_WITHOUT_ADDON_KEY=true to release without one."
              exit 1
            fi
          fi
      - id: v
        name: Tag is semver and matches the app version
        run: |
          node scripts/version.mjs check "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    permissions:
      contents: write
    # Creates the release once, so the three platform builds (which run in
    # parallel) only upload to it instead of racing to create it.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Zeima $GITHUB_REF_NAME" \
            --notes "See the assets below to download and install." "${flags[@]}"

  build:
    permissions:
      contents: write
    needs: [verify, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            # WiX (msi) rejects non-numeric prerelease tags such as -rc.1.
            args: '--bundles nsis'
          - os: macos-latest # Apple silicon
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          # Intel Mac build disabled for now (the macos-13 runner is retired).
          # - os: macos-13
          #   args: '--target x86_64-apple-darwin'
          #   target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: bun install --frozen-lockfile
      # A final release for macOS must be signed; set ZEIMA_ALLOW_UNSIGNED_MACOS=true (repository variable) to ship one anyway.
      - name: A final macOS release is signed
        if: runner.os == 'macOS' && needs.verify.outputs.prerelease != 'true'
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          ALLOW_UNSIGNED: ${{ vars.ZEIMA_ALLOW_UNSIGNED_MACOS }}
        run: |
          if [ "$HAS_CERT" != "true" ] && [ "$ALLOW_UNSIGNED" != "true" ]; then
            echo "::error::No Apple signing certificate is set, so this macOS build would be unsigned. Set the APPLE_* secrets, or set ZEIMA_ALLOW_UNSIGNED_MACOS=true to release it anyway."
            exit 1
          fi
      - name: macOS signing (only when the Apple secrets are set)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Unset secrets arrive as empty strings, and Tauri treats an empty
        # APPLE_CERTIFICATE as "sign" and fails. Export only what is set.
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No Apple certificate: building unsigned."; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              # A random delimiter, so a value cannot end its own entry and set other variables.
              d="EOF_$(openssl rand -hex 16)"
              printf '%s<<%s\n%s\n%s\n' "$v" "$d" "${!v}" "$d" >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (see docs/releasing.md for the key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Keys of the licence issuers this build trusts (a repository variable).
          ZEIMA_ENTITLEMENT_KEYS: ${{ vars.ZEIMA_ENTITLEMENT_KEYS }}
          # The vendor's addon publisher keys, compiled into the app (`key-id=Name=public-key;…`; a repository variable).
          # A server's registry can add publishers but never replace these (docs/addons.md).
          ZEIMA_ADDON_VENDOR_KEYS: ${{ vars.ZEIMA_ADDON_VENDOR_KEYS }}
        with:
          tauriScript: bunx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Zeima ${{ github.ref_name }}
          releaseBody: See the assets below to download and install.
          releaseDraft: false
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          # latest.json: what the app's updater reads.
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  addons:
    permissions:
      contents: write
    # Runs after the app builds: they create the release, which the addon
    # zips are attached to. Waiting inside this job timed out, because the
    # builds take longer than the wait. Still runs if one platform failed.
    needs: [verify, release, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            addons/csv-export
            addons/recent-notes
            addons/ics-calendar
            addons/day-digest
      - name: Build example addons
        run: |
          bash addons/build.sh csv-export
          bash addons/build.sh recent-notes
          bash addons/build.sh ics-calendar
          bash addons/build.sh day-digest
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" addons/dist/*.zip --clobber
