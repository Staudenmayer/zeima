name: Release

# Push a semver tag (v1.2.3, v1.2.3-rc.1) to build installers for every
# platform and attach them to a GitHub release. Bump the version first:
#   node scripts/version.mjs set 1.2.3 && git commit -am "chore: release 1.2.3"
#   git tag v1.2.3 && git push --follow-tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: v
        name: Tag is semver and matches the app version
        run: |
          node scripts/version.mjs check "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    # Creates the release once, so the three platform builds (which run in
    # parallel) only upload to it instead of racing to create it.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Zeima $GITHUB_REF_NAME" \
            --notes "See the assets below to download and install." "${flags[@]}"

  build:
    needs: [verify, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            # WiX (msi) rejects non-numeric prerelease tags such as -rc.1.
            args: '--bundles nsis'
          - os: macos-latest # Apple silicon
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          # Intel Mac build disabled for now (the macos-13 runner is retired).
          # - os: macos-13
          #   args: '--target x86_64-apple-darwin'
          #   target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: macOS signing (only when the Apple secrets are set)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Unset secrets arrive as empty strings, and Tauri treats an empty
        # APPLE_CERTIFICATE as "sign" and fails. Export only what is set.
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No Apple certificate: building unsigned."; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (see docs/releasing.md for the key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Keys of the licence issuers this build trusts (a repository variable).
          ZEIMA_ENTITLEMENT_KEYS: ${{ vars.ZEIMA_ENTITLEMENT_KEYS }}
        with:
          tauriScript: bunx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Zeima ${{ github.ref_name }}
          releaseBody: See the assets below to download and install.
          releaseDraft: false
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          # latest.json: what the app's updater reads.
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  addons:
    # Runs after the app builds: they create the release, which the addon
    # zips are attached to. Waiting inside this job timed out, because the
    # builds take longer than the wait. Still runs if one platform failed.
    needs: [verify, release, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            addons/csv-export
            addons/recent-notes
      - name: Build example addons
        run: |
          bash addons/build.sh csv-export
          bash addons/build.sh recent-notes
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" addons/dist/*.zip --clobber
