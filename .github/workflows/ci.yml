name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Cargo.toml and the package.json files must carry the same version.
      - run: node scripts/version.mjs check
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bunx vite build

  server:
    runs-on: ubuntu-latest
    # Row-level security tests (server/test/db.test.ts) need a real Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zeima
          POSTGRES_PASSWORD: zeima
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zeima" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://zeima:zeima@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The server tests include zeima-core running as WebAssembly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.100
      - name: Build @zeima/core-wasm
        run: bun run --cwd packages/core-wasm build
      - name: Lint
        run: bun run lint
        working-directory: server
      - name: Typecheck
        run: bun run typecheck
        working-directory: server
      # Includes the contract check: packages/api-contract/openapi.json must
      # match the routes (bun run --cwd server openapi:export).
      - name: Test
        run: bun run test
        working-directory: server
      - name: TypeScript API types are current
        run: |
          bun run --cwd packages/api-contract generate
          git diff --exit-code -- packages/api-contract/schema.d.ts \
            || { echo "run: bun run --cwd packages/api-contract generate"; exit 1; }
      # A pull request may not break clients of the current API version
      # (SPEC §7: breaking changes need a new /v<n>).
      - name: No breaking API changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if git show "origin/$GITHUB_BASE_REF:packages/api-contract/openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            docker run --rm -v "$PWD:/w" -v /tmp:/t docker.io/tufin/oasdiff breaking \
              /t/base-openapi.json /w/packages/api-contract/openapi.json --fail-on ERR
          else
            echo "the base branch has no committed contract yet"
          fi
      - name: Keycloak realm is valid JSON
        run: python3 -m json.tool deploy/keycloak/realm-zeima.json > /dev/null
      - name: Docker image builds
        run: docker build -f server/Dockerfile -t zeima-api:ci .

  # Boots the self-hosted stack (deploy/docker-compose.yml) and runs a real
  # sign-in and sync against it, so self-hosting cannot silently break.
  selfhosted:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://localhost:8443
      ID_URL: https://id.localhost:8443
      KEYCLOAK_ADMIN_PASSWORD: ci-admin-password
      NODE_TLS_REJECT_UNAUTHORIZED: "0" # Caddy's local CA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure
        run: |
          cat > deploy/.env <<EOF
          DOMAIN=localhost
          PUBLIC_URL=$PUBLIC_URL
          ID_URL=$ID_URL
          POSTGRES_PASSWORD=ci-postgres-password
          KEYCLOAK_DB_PASSWORD=ci-keycloak-db-password
          KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD
          API_ADMIN_SECRET=ci-api-admin-secret
          HTTP_PORT=8088
          HTTPS_PORT=8443
          EOF
          echo "127.0.0.1 id.localhost" | sudo tee -a /etc/hosts
      - name: Start the stack
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
      - name: Wait for sign-in and the API
        run: |
          for i in $(seq 1 60); do
            curl -skf "$ID_URL/realms/zeima/.well-known/openid-configuration" > /dev/null \
              && curl -skf "$PUBLIC_URL/readyz" > /dev/null && exit 0
            sleep 5
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      # Realm changes reach running installations this way (deploy/keycloak/apply.sh);
      # the sign-in must keep working after it.
      - name: Apply the realm with keycloak-config-cli
        env:
          KEYCLOAK_URL: http://keycloak:8080
          KEYCLOAK_PASSWORD: ${{ env.KEYCLOAK_ADMIN_PASSWORD }}
          CONTAINER_NETWORK: zeima_default
          ZEIMA_API_ADMIN_SECRET: ci-api-admin-secret
          ZEIMA_API_URL: ${{ env.PUBLIC_URL }}
          ZEIMA_WEB_URL: ${{ env.PUBLIC_URL }}
          ZEIMA_SWAGGER_ENABLED: "false"
          ZEIMA_VERIFY_EMAIL: "false"
        run: deploy/keycloak/apply.sh
      - name: Sign in and sync
        run: node deploy/e2e/smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p dist
        shell: bash
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The addon host tests load these; elsewhere they skip themselves.
      - name: Build example addons
        if: runner.os == 'Linux'
        run: |
          bash addons/build.sh csv-export
          bash addons/build.sh recent-notes
          bash addons/build.sh ics-calendar
          bash addons/build.sh host-test
      # The zeima (src-tauri) lib test exe has no application manifest on
      # Windows and dies with STATUS_ENTRYPOINT_NOT_FOUND (Common Controls v6
      # via rfd), so it is tested on Linux and macOS only.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-features
      - name: Test (Windows, without the Tauri crate)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude zeima --all-features
      # The test suite regenerates src/bindings.ts; it must match the commit.
      - name: Generated files are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code src/bindings.ts crates/zeima-core/jurisdictions/profile.schema.json crates/zeima-core/addon.schema.json
      - name: zeima-core builds without the db feature (WASM-ready)
        if: runner.os == 'Linux'
        run: cargo check -p zeima-core --no-default-features
      - name: Addon SDK builds for WASM
        if: runner.os == 'Linux'
        run: cargo check -p zeima-addon-sdk --target wasm32-unknown-unknown
