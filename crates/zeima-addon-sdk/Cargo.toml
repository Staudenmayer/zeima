[package]
name = "zeima-addon-sdk"
description = "Build addons for Zeima: typed host API and hook payloads"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["guest"]
# Host functions and Extism PDK for addons compiled to WASM. The app uses
# the crate without it, only for the shared payload types.
guest = ["dep:extism-pdk"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
extism-pdk = { version = "1.4", optional = true }
